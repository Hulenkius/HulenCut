name: Build HulenCut

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python 3.8
      uses: actions/setup-python@v4
      with:
        python-version: "3.8"

    - name: Upgrade pip and install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller PyQt5 numpy opencv-python

    - name: Build with PyInstaller
      run: |
        pyinstaller cutter.spec

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3.1.2  # 更新版本，避免使用已棄用的 v3
      with:
        name: HulenCut
        path: dist/HulenCut
